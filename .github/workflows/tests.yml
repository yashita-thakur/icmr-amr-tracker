name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The report PDFs are never committed (see DATA_LICENSE.md), so the tests
      # that parse them skip here; everything else runs.
      - run: pytest
